<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fahi Jamiyyaa{% endblock %}</title>
    <script>
        if (localStorage.getItem('dark') === 'true' || (!localStorage.getItem('dark') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'},
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-link { transition: all 0.2s; }
        .sidebar-link:hover { background: rgba(99,102,241,0.1); }
        .sidebar-link.active { background: rgba(99,102,241,0.15); color: #4f46e5; border-right: 3px solid #4f46e5; }
        .dark .sidebar-link:hover { background: rgba(99,102,241,0.15); }
        .dark .sidebar-link.active { background: rgba(99,102,241,0.2); color: #818cf8; border-right-color: #818cf8; }
        @media (max-width: 768px) { .sidebar-open { transform: translateX(0) !important; } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 font-sans antialiased transition-colors">
    <div class="min-h-screen flex">
        {% include 'components/sidebar.html' %}
        <div class="flex-1 flex flex-col min-h-screen lg:ml-64">
            {% include 'components/topbar.html' %}
            <main class="flex-1 p-4 md:p-6 lg:p-8">
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-4 rounded-lg text-sm {% if message.tags == 'success' %}bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300 border border-green-200 dark:border-green-800{% elif message.tags == 'error' %}bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800{% else %}bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800{% endif %}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script>
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        document.getElementById('sidebarToggle')?.addEventListener('click', function() {
            sidebar.classList.toggle('-translate-x-full');
            if (backdrop) backdrop.classList.toggle('hidden');
        });
        backdrop?.addEventListener('click', function() {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        });
        document.addEventListener('DOMContentLoaded', function() {
            flatpickr('input:not([type="hidden"]):not([name^="initial-"])[type="date"]', { dateFormat: 'Y-m-d', allowInput: true });
            flatpickr('input:not([type="hidden"]):not([name^="initial-"])[name$="_date"], input:not([type="hidden"]):not([name^="initial-"])[name$="date"]', { dateFormat: 'Y-m-d', allowInput: true });
        });
    </script>
</body>
</html>
