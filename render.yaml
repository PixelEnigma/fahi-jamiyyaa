services:
  - type: web
    name: fahi-jamiyyaa
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: worker
    name: fahi-jamiyyaa-bot
    runtime: python
    buildCommand: ./build.sh
    startCommand: python manage.py runbot
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
